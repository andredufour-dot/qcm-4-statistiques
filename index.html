<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Statistiques · QCM 4</title><meta name="description" content="Statistiques · QCM 4"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142f40'/%3E%3Ctext x='12' y='47' font-size='43' fill='%237ed6c3'%3E%CF%83%3C/text%3E%3C/svg%3E"><style>
:root{--navy:#142f40;--teal:#087b70;--paper:#f7f7f2;--line:#dce3df;--muted:#526772;--orange:#ab4937}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:17px/1.55 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--teal)}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #e3a633;outline-offset:4px}header{background:var(--navy);color:white;padding:22px max(24px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:750;font-size:20px;letter-spacing:.01em}.brand span{color:#8fdfcb;margin-right:12px}.header-note{font-size:14px;color:#c7d8dc}main{max-width:1200px;margin:0 auto;padding:38px 24px 64px}.intro{max-width:810px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--teal);font-size:12px;font-weight:800;margin:0 0 10px}h1{font-size:clamp(30px,4vw,44px);line-height:1.13;letter-spacing:-.035em;margin:0 0 16px}p{margin:0 0 15px}.sub{color:var(--muted);font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 8px 32px #142f4005}.qtop{display:flex;justify-content:space-between;gap:16px;font-size:13px;font-weight:700;color:var(--teal);margin-bottom:20px}h2{font-size:24px;line-height:1.35;letter-spacing:-.015em;margin:0 0 23px}fieldset{margin:0;padding:0;border:0;min-width:0}legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.options{display:grid;gap:12px}.option{position:relative;display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s}.option:hover{background:#f4faf8;border-color:#91bfb6}.option:has(input:checked){background:#eaf7f2;border:2px solid var(--teal);padding:15px 17px}.option input{margin-top:6px;accent-color:var(--teal);width:17px;height:17px;flex-shrink:0}.letter{font-size:13px;font-weight:800;color:var(--muted);padding-top:3px}.option-text{flex:1}.bottom{margin-top:26px;padding-top:23px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.btn{border:1px solid var(--line);border-radius:9px;padding:11px 19px;background:white;font-weight:650;color:var(--navy)}.btn:hover{background:#edf3f0}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:#066459}.btn:disabled{opacity:.4;cursor:not-allowed}.aside-title{font-size:16px;margin:0 0 15px}.side{padding:23px}.progress{height:7px;background:#e6ece8;border-radius:9px;overflow:hidden;margin:14px 0 20px}.progress div{height:100%;background:var(--teal);transition:width .2s}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.navq{min-height:42px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--navy);font-weight:650}.navq.done{background:#e0f2e9;color:#086555;border-color:#b6d9ca}.navq[aria-current=true]{outline:2px solid var(--teal);outline-offset:2px}.micro{font-size:13px;color:var(--muted);margin-top:15px}.side .btn{width:100%;margin-top:16px}.error{color:var(--orange);font-size:14px;margin:15px 0 0}details{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}summary{font-weight:650;cursor:pointer}details>div{padding-top:15px;color:var(--muted);font-size:15px}.data{margin:0 0 24px}.data h2{margin-bottom:12px}.data h3{font-size:19px;margin:0 0 12px}.data p{font-size:15px;color:var(--muted)}.tablewrap{overflow-x:auto;margin:15px 0}table{border-collapse:collapse;min-width:620px;width:100%;font-size:13px}caption{text-align:left;font-weight:700;margin-bottom:8px}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;white-space:nowrap}th:first-child{text-align:left}thead{background:#edf2ef}footer{border-top:1px solid var(--line);margin-top:38px;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--muted)}.results-head{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.score{font-size:56px;font-weight:800;letter-spacing:-.05em;color:var(--teal)}.score small{font-size:25px;color:var(--muted)}.review{margin:16px 0}.review h3{font-size:19px;margin:0 0 15px}.tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:9px}.tag.wrong{color:var(--orange)}.answer-line{font-size:15px;margin-bottom:9px}.explain{border-top:1px solid var(--line);padding-top:15px;margin-top:15px;color:var(--muted);font-size:16px}.result-actions{display:flex;gap:12px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{order:2}.grid{grid-template-columns:repeat(7,1fr)}header{padding:18px 22px}.header-note{font-size:12px}main{padding-top:27px}.card{padding:23px}.qtop{margin-bottom:15px}h2{font-size:21px}footer{display:block}.score{font-size:48px}}@media(max-width:440px){main{padding-left:16px;padding-right:16px}.card{padding:19px}.option{padding:13px 12px;gap:10px}.option:has(input:checked){padding:12px 11px}.btn{padding:10px 13px}.grid{gap:7px}.bottom{gap:7px}}@media print{header,.intro,.aside,.data,.result-actions,footer{display:none}.card{box-shadow:none;break-inside:avoid}.results-head{display:block}main{padding:0}.review{border-radius:0}}
</style></head><body><header><div class="brand"><span>σ</span><span style="color:#c7d8dc;font-weight:400;margin-left:10px">Statistiques · QCM 4</span></div><div class="header-note">Master 2 NCC</div></header><main><div id="quiz" class="layout"><div><section class="data card" aria-label="Énoncé et données"><h2 id="statement-title" tabindex="-1">Énoncé</h2><p id="case-summary"></p><div id="case-data"></div></section><section id="question-card" class="card" aria-labelledby="question-title"></section></div><aside class="aside"><section class="card side"><h2 class="aside-title">Votre progression</h2><div id="answered" aria-live="polite"></div><div class="progress" role="progressbar" aria-label="Questions répondues" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div id="bar"></div></div><nav class="grid" id="question-nav" aria-label="Navigation entre les questions"></nav><p class="micro">Vous pouvez passer une question ou choisir « Je ne sais pas ». Une réponse absente vaut 0 point. Vous pouvez modifier vos choix avant l’envoi.</p><button id="finish" class="btn primary">Terminer et envoyer mes réponses</button><p id="message" class="error" role="status"></p></section></aside></div><section id="results" class="hidden" aria-labelledby="results-title"></section></main><script>
const questions=[{"id": 1, "exercise": 1, "question": "La variable indépendante est", "options": ["Le type de nerf stimulé.", "La vitesse de conduction du nerf médian.", "L’âge des sujets.", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Le facteur comparé est l’âge, réparti en trois groupes : 20–30 ans, 40–50 ans et plus de 70 ans. Le nerf étudié est le même dans les trois groupes."}, {"id": 2, "exercise": 1, "question": "La variable dépendante est", "options": ["Le type de nerf stimulé.", "La vitesse de conduction du nerf médian.", "L’âge des sujets.", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "La variable dépendante est la mesure recueillie : la vitesse de conduction du nerf médian, en m·s⁻¹."}, {"id": 3, "exercise": 1, "question": "L'hypothèse d'égalité des variances suppose que", "options": ["Les variances σ₁², σ₂² et σ₃² sont identiques.", "Les variances σ₁², σ₂² et σ₃² ne diffèrent pas significativement.", "Les variances s₁², s₂² et s₃² sont identiques.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "L’hypothèse d’homogénéité porte sur les variances de population : σ₁² = σ₂² = σ₃². Elle n’exige pas que les variances d’échantillon s₁², s₂² et s₃² soient exactement identiques. Un test non significatif ne démontre pas l’égalité des variances."}, {"id": 4, "exercise": 1, "question": "La distribution d'échantillonnage utilisée sous l'hypothèse nulle est", "options": ["la distribution du rapport de 2 variances.", "la distribution de la moyenne des différences.", "la distribution de la différence de deux proportions.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "La statistique de l’ANOVA est le rapport du carré moyen inter-groupes au carré moyen intra-groupes. Sous l’hypothèse nulle et les conditions du modèle, elle suit une loi F de Fisher à 2 et 27 degrés de liberté."}, {"id": 5, "exercise": 1, "question": "Le carré moyen inter groupe est environ égal à", "options": ["122.3", "850.2", "148.6", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Les moyennes sont 44,8, 39,5 et 37,3 m·s⁻¹. La somme des carrés inter-groupes vaut 297,2667. Le carré moyen inter-groupes est donc 297,2667 / (3 − 1) ≈ 148,6."}, {"id": 6, "exercise": 1, "question": "Sachant que la somme des carrés intra groupe est de 166.20, le rapport de Fisher est environ égal à", "options": ["24.15", "2.10", "4.84", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "CM intra = 166,20 / (30 − 3) ≈ 6,1556. Le rapport de Fisher vaut F = 148,6333 / 6,1556 ≈ 24,15."}, {"id": 7, "exercise": 1, "question": "La probabilité du rapport de Fisher calculé sur les données du tableau est", "options": ["inférieure au seuil a = 0.05.", "supérieure au seuil a = 0.05.", "comprise entre 0.01 et 0.05.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "F(2,27) ≈ 24,15 donne une probabilité inférieure à 0,001, donc au seuil de 0,05. L’hypothèse d’égalité des trois moyennes est rejetée."}, {"id": 8, "exercise": 1, "question": "De ces résultats on peut conclure que", "options": ["La vitesse de conduction du nerf médian ne diffère pas significativement entre les trois groupes d’âge.", "La vitesse de conduction du nerf médian diffère significativement entre les trois groupes d’âge.", "L’âge des trois groupes de sujets ne diffère pas significativement.", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "L’ANOVA met en évidence une différence globale de vitesse de conduction entre les groupes d’âge. Cela signifie qu’au moins une moyenne diffère, sans établir que les trois paires diffèrent toutes significativement."}, {"id": 9, "exercise": 1, "question": "Le tracé graphique semble montrer que", "options": ["Le ralentissement de la vitesse de conduction est linéaire.", "Le ralentissement de la vitesse de conduction est constant d’une tranche d’âge à l’autre.", "Le ralentissement de la vitesse de conduction nerveuse est plus important entre les jeunes et les personnes d’âge moyen qu’entre ces derniers et les personnes âgées.", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "La moyenne diminue de 44,8 à 39,5 m·s⁻¹, soit 5,3 m·s⁻¹, entre les jeunes et les adultes d’âge moyen. Elle diminue ensuite de 39,5 à 37,3 m·s⁻¹, soit 2,2 m·s⁻¹. Le premier écart est plus important."}, {"id": 10, "exercise": 1, "question": "La variabilité induite par l’âge représente environ", "options": ["50% de la variabilité totale.", "35% de la variabilité totale.", "64% de la variabilité totale.", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "R² = SC inter / SC totale = 297,2667 / (297,2667 + 166,20) ≈ 0,6414, soit environ 64 % de la variabilité totale."}, {"id": 11, "exercise": 2, "question": "Le lien entre l’âge et les performances spatiales, peut-être modélisé par la fonction", "options": ["T = -0.95A + 70.12", "T = -0.65A + 57.74", "T = 0.95A + 65.25", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "La droite des moindres carrés est T ≈ −0,64561A + 57,74386. En arrondissant les coefficients comme dans les choix proposés, on obtient T = −0,65A + 57,74."}, {"id": 12, "exercise": 2, "question": "Le coefficient de corrélation entre l’âge et les performances spatiales est environ égal à", "options": ["- 0.85", "- 0.95", "- 0.90", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Le coefficient de Pearson calculé sur les 17 paires vaut r ≈ −0,9543, soit environ −0,95. La relation linéaire est fortement négative."}, {"id": 13, "exercise": 2, "question": "Le modèle mathématique donné plus haut prédit qu’un adulte âgé de 79 ans obtiendrait un score au test spatial de", "options": ["11.5", "6.4", "9.5", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "En utilisant le modèle arrondi donné dans la question précédente, T = −0,65 × 79 + 57,74 = 6,39, soit environ 6,4. Sans arrondir les coefficients de régression, la prédiction serait environ 6,74."}, {"id": 14, "exercise": 2, "question": "L’erreur standard d’estimation associée à la droite de régression est environ égale à", "options": ["0.94", "1.25", "0.55", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "La valeur proposée 0,94 correspond à un calcul approché utilisant r arrondi à −0,95 : sT × √[(1 − r²) × 16/15] ≈ 0,95. Avec les données et le coefficient non arrondis, l’erreur standard √[Σ(T − T prédit)² / 15] vaut environ 0,91. La proposition A est la plus proche."}, {"id": 15, "exercise": 2, "question": "La statistique de test permettant de vérifier la signification du coefficient de corrélation est", "options": ["le F de Fisher", "le χ²", "le t de Student", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Le test direct de H₀ : ρ = 0 utilise t = r × √[(n − 2) / (1 − r²)], avec n − 2 = 15 degrés de liberté. En régression simple, le test F équivalent utilise F = t²."}, {"id": 16, "exercise": 2, "question": "La statistique de test permettant de vérifier la signification du coefficient de corrélation est environ égale à", "options": ["- 9.25", "- 6.24", "- 21.78", "Aucune des réponses ci-dessus ne convient."], "answer": 3, "explanation": "Avec r ≈ −0,9543 et n = 17, t = r × √[15 / (1 − r²)] ≈ −12,37. Aucune des trois valeurs proposées ne convient."}, {"id": 17, "exercise": 2, "question": "On ne peut pas tester l'hypothèse alternative parce que", "options": ["l'hypothèse alternative ne donne pas une valeur exacte du paramètre à tester.", "la distribution d'échantillonnage ne peut pas être définie de manière exacte sous l'hypothèse nulle.", "la distribution d'échantillonnage ne peut être définie que sous l'hypothèse alternative.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "Dans le test classique, l’hypothèse alternative est généralement composite : elle rassemble plusieurs valeurs possibles du paramètre et ne définit donc pas une unique distribution de référence. La statistique est évaluée sous H₀. Une alternative simple explicitement spécifiée peut, elle, définir une distribution."}, {"id": 18, "exercise": 2, "question": "Le coefficient d’intensité d’effet R² exprime", "options": ["la part de variabilité intra-groupe dans la variabilité totale.", "la part de variabilité inter-groupe dans la variabilité totale.", "l’interaction entre la variabilité inter-groupe et la variabilité totale.", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Dans l’ANOVA, R² = SC inter-groupes / SC totale. Il exprime la part de variabilité expliquée par les différences entre groupes."}, {"id": 19, "exercise": 2, "question": "L’application de l’ANOVA requiert que", "options": ["les observations soient indépendantes entre les groupes expérimentaux.", "la distribution des variances soit normale.", "la distribution des moyennes soit normale.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "Pour cette ANOVA à groupes indépendants, les observations doivent être indépendantes. La normalité concerne les erreurs au sein des groupes, et non une distribution des variances."}, {"id": 20, "exercise": 2, "question": "Le rapport de 2 variances est toujours", "options": ["compris entre - ∞ et + ∞ .", "compris entre 0 et + ∞.", "compris entre 0 et 1.", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Une variance est positive ou nulle. Si la variance au dénominateur est strictement positive, le rapport est compris entre 0 et +∞. Si le dénominateur est nul, le rapport n’est pas défini."}];
const cases={"1": {"summary": "Exercice 1", "intro": "Dans une étude sur le vieillissement du système nerveux périphérique, des chercheurs ont comparé la vitesse de conduction du nerf médian de jeunes adultes (20 à 30 ans), d’adultes d’âge moyen (40 à 50 ans) et de personnes âgées (plus de 70 ans). La vitesse de conduction du nerf médian, exprimée en m·s⁻¹, a été évaluée par électromyographie.", "caption": "Vitesse de conduction du nerf médian (m·s⁻¹)", "rows": [["20–30 ans", 45, 47, 43, 45, 46, 46, 48, 41, 44, 43], ["40–50 ans", 43, 39, 41, 38, 39, 40, 41, 37, 38, 39], ["> 70 ans", 40, 38, 40, 37, 33, 36, 40, 42, 35, 32]], "note": ""}, "2": {"summary": "Exercice 2", "intro": "Dans une étude sur l’effet du vieillissement, des chercheurs ont essayé d’évaluer le lien entre l’âge et les performances spatiales chez des adultes de plus de 60 ans. L’examen des scores révèle que les données suivent une distribution normale.", "caption": "Âge et performances spatiales", "rows": [["Âge (A)", 66, 65, 62, 64, 72, 70, 63, 65, 68, 67, 62, 60, 71, 75, 74, 69, 68], ["Test spatial (T)", 14, 16, 18, 16, 10, 12, 17, 15, 14, 16, 18, 20, 13, 10, 11, 12, 13]], "note": ""}};
let current=0;let answers=Array(questions.length).fill(null);let completed=false;
const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const letter=i=>'ABCD'[i];
function renderQuestion(focus=false){const q=questions[current];$('question-card').innerHTML=`<div class="qtop"><span>QUESTION ${q.id} / 20</span></div><h2 id="question-title" tabindex="-1">${escape(q.question)}</h2><fieldset><legend>Choisissez une seule réponse</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}><span class="letter">${letter(i)}</span><span class="option-text">${escape(o)}</span></label>`).join('')}</div></fieldset><button type="button" class="btn" id="clear-answer" style="margin-top:16px">Je ne sais pas / laisser sans réponse</button><div class="bottom"><button class="btn" id="prev" ${current===0?'disabled':''}>Précédente</button><button class="btn primary" id="next">${current===19?'Voir ma progression':'Question suivante'}</button></div>`;
$('question-card').querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{answers[current]=Number(r.value);$('message').textContent='';renderProgress();}));$('clear-answer').onclick=()=>{answers[current]=null;renderQuestion(true);};$('prev').onclick=()=>go(current-1);$('next').onclick=()=>{if(current<19)go(current+1);else{$('finish').scrollIntoView({behavior:'smooth',block:'center'});$('finish').focus();}};renderProgress();const c=cases[q.exercise];$('case-summary').textContent=c.summary;$('case-data').innerHTML=`<p>${escape(c.intro)}</p><div class="tablewrap"><table><caption>${escape(c.caption)}</caption><thead><tr><th scope="col">Groupe</th>${c.rows[0].slice(1).map((_,i)=>`<th scope="col">${c.headers?escape(c.headers[i]):i+1}</th>`).join('')}</tr></thead><tbody>${c.rows.map(row=>`<tr><th scope="row">${escape(row[0])}</th>${row.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>${escape(c.note)}</p>`;if(focus)$('question-title').focus({preventScroll:true});}
function renderProgress(){let n=answers.filter(a=>a!==null).length;$('answered').textContent=`${n} réponse${n>1?'s':''} sur 20`;$('bar').style.width=`${n/20*100}%`;document.querySelector('.progress').setAttribute('aria-valuenow',n);$('question-nav').innerHTML=questions.map((q,i)=>`<button class="navq ${answers[i]!==null?'done':''}" aria-current="${i===current}" aria-label="Question ${i+1}, ${answers[i]!==null?'répondue':'sans réponse'}" data-q="${i}">${i+1}</button>`).join('');$('question-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.q)));}
function go(i){if(i<0||i>=20||completed)return;const changed=questions[i].exercise!==questions[current].exercise;current=i;renderQuestion(!changed);if(changed){$('statement-title').focus({preventScroll:true});$('statement-title').scrollIntoView({behavior:'smooth',block:'start'});}else{$('question-card').scrollIntoView({behavior:'smooth',block:'start'});}}
$('finish').onclick=()=>{completed=true;const score=answers.filter((a,i)=>a===questions[i].answer).length;$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<div class="card results-head"><div class="score">${score}<small> / 20</small></div><div><p class="eyebrow">Votre résultat</p><h2 id="results-title" tabindex="-1">${score===20?'Toutes les réponses sont correctes.':'Le corrigé pour comprendre vos réponses.'}</h2><p class="sub">${score} bonne${score>1?'s':''} réponse${score>1?'s':''} · ${Math.round(score/20*100)} % de réussite.</p><div class="result-actions"><button class="btn primary" id="retry">Recommencer le QCM</button><button class="btn" id="print">Imprimer le corrigé</button></div></div></div>${questions.map((q,i)=>`<article class="card review"><p class="tag ${answers[i]===q.answer?'':'wrong'}">Question ${q.id} · ${answers[i]===null?'Sans réponse':answers[i]===q.answer?'Bonne réponse':'À revoir'}</p><h3>${escape(q.question)}</h3><p class="answer-line">${answers[i]===null?'<strong>Vous avez laissé cette question sans réponse.</strong>':`<strong>Votre réponse ${letter(answers[i])} :</strong> ${escape(q.options[answers[i]])}`}</p>${answers[i]!==q.answer?`<p class="answer-line"><strong>Bonne réponse ${letter(q.answer)} :</strong> ${escape(q.options[q.answer])}</p>`:''}<p class="explain">${escape(q.explanation)}</p></article>`).join('')}`;$('retry').onclick=()=>{answers=Array(20).fill(null);current=0;completed=false;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('message').textContent='';renderQuestion(true);window.scrollTo({top:0,behavior:'smooth'});};$('print').onclick=()=>window.print();$('results-title').focus();window.scrollTo({top:0,behavior:'smooth'});};renderQuestion();
</script><script>window.QCM_RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbxxBUVfyHRBsVf62bA85YS2ykNneWUYAQp3bptzkI8snQRos3BcQqgDmh1Kvv2aCD_9/exec";
/* Suivi facultatif des tentatives, indépendant de l’hébergeur du QCM. */
(() => {
  const endpoint = window.QCM_RESULTS_ENDPOINT;
  if (!endpoint) return;
  let startedAt;
  let studentAlias = '';
  const quizPanel = document.getElementById('quiz');
  const welcome = document.createElement('section');
  welcome.className = 'card';
  welcome.id = 'welcome';
  welcome.innerHTML = `<h2>Avant de commencer</h2><p>Saisissez votre prénom et l'initiale de votre nom</p>
    <form id="start-form"><label for="start-alias">Votre nom</label><br><input id="start-alias" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px">
    
    <button class="btn primary" type="submit">Commencer le QCM</button><p id="start-error" role="status"></p></form>`;
  quizPanel.before(welcome);
  quizPanel.classList.add('hidden');
  welcome.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.getElementById('start-alias');
    studentAlias = input.value.trim();
    if (studentAlias.length < 2 || /[\x00-\x1f\x7f]/.test(studentAlias)) { document.getElementById('start-error').textContent = 'Saisissez un nom valide (2 à 60 caractères).'; return; }
    startedAt = new Date().toISOString();
    welcome.classList.add('hidden');
    quizPanel.classList.remove('hidden');
    document.getElementById('statement-title').focus({preventScroll:true});
    window.scrollTo({top:0,behavior:'smooth'});
  });
  const finish = document.getElementById('finish');
  finish.addEventListener('click', () => {
    if (!completed) return;
    const attempt = {
      version: 1,
      quizId: 'qcm4-v1',
      attemptId: crypto.randomUUID(),
      startedAt,
      finishedAt: new Date().toISOString(),
      answers: answers.map((value, index) => ({questionId: questions[index].id, answer: value})),
    };
    const section = document.createElement('section');
    section.className = 'card';
    section.setAttribute('aria-labelledby', 'tracking-title');
    section.innerHTML = `<h2 id="tracking-title">Envoyer mes réponses pour voir ma note</h2>
      <p>Pour suivre votre progression, utilisez le même nom à chaque tentative. </p>
      <form id="tracking-form"><label for="student-alias">Votre nom</label><br>
      <input id="student-alias" name="alias" type="text" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px">
      <div><button class="btn primary" type="submit">Envoyer mon résultat</button></div>
      <p id="tracking-status" role="status" aria-live="polite" style="margin-top:12px"></p></form>`;
    const resultPanel = document.getElementById('results');
    const correction = document.createElement('div');
    correction.className = 'hidden';
    correction.id = 'correction';
    while(resultPanel.firstChild) correction.appendChild(resultPanel.firstChild);
    resultPanel.append(section, correction);
    resultPanel.setAttribute('aria-labelledby', 'tracking-title');
    const omitted = answers.filter(a => a === null).length;
    const summary = document.createElement('p');
    summary.textContent = `${answers.length - omitted} réponse(s) renseignée(s), ${omitted} question(s) sans réponse. La note et le corrigé apparaîtront après l’envoi.`;
    section.querySelector('h2').after(summary);
    section.style.marginBottom = "24px";
    const form = section.querySelector('form');
    const status = section.querySelector('#tracking-status');
    const alias = section.querySelector('input');
    const button = section.querySelector('button');
    alias.value = studentAlias;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (alias.value.trim().length < 2) { status.textContent = 'Saisissez un nom d’au moins deux caractères.'; return; }
      button.disabled = true;
      alias.disabled = true;
      status.textContent = 'Envoi en cours…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=UTF-8'},
          body: JSON.stringify({...attempt, alias: alias.value.trim()}),
          signal: controller.signal,
          credentials: 'omit',
        });
        if (!response.ok) throw new Error('HTTP');
        const result = await response.json();
        if (result.ok !== true || result.attemptId !== attempt.attemptId) throw new Error('Unconfirmed');
        status.textContent = 'Votre résultat a bien été enregistré. Vous pouvez consulter le corrigé ci-dessous.';
        button.textContent = 'Résultat envoyé';
        correction.classList.remove('hidden');
        resultPanel.setAttribute('aria-labelledby', 'results-title');
        document.getElementById('results-title').focus();
      } catch (_) {
        status.textContent = 'L’enregistrement n’a pas pu être confirmé. La note et le corrigé restent masqués. Vous pouvez réessayer : cette tentative ne sera pas comptée deux fois.';
        button.disabled = false;
        alias.disabled = false;
        button.textContent = 'Réessayer l’envoi';
      } finally { clearTimeout(timeout); }
    });
    document.getElementById('tracking-title').setAttribute('tabindex', '-1');
    document.getElementById('tracking-title').focus();
    document.getElementById('retry').addEventListener('click', () => {
      quizPanel.classList.add('hidden');
      welcome.classList.remove('hidden');
      document.getElementById('start-alias').value = studentAlias;
      document.getElementById('start-alias').focus();
    });
  });
})();
</script></body></html>
